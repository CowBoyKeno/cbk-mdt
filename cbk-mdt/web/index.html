<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CBK MDT</title>
    <link rel="stylesheet" href="app.css">
</head>
<body>
    <div id="mdtRoot" class="mdt hidden" role="application" aria-label="Police MDT">
        <div id="mdtHeader" class="mdt-header">
            <div class="title-block">
                <span class="title">CBK Police MDT</span>
                <span id="subtitle" class="subtitle">Mobile Data Terminal</span>
            </div>
            <div class="header-actions">
                <button id="refreshDashboard" class="btn btn-ghost">Refresh</button>
                <button id="closeMdt" class="btn btn-danger">Close</button>
            </div>
        </div>

        <div class="mdt-content">
            <nav class="top-nav">
                <button class="nav-btn" data-page="radar">ALPR</button>
                <button class="nav-btn" data-page="bolos">BOLO's</button>
                <button class="nav-btn" data-page="officer">Officer Profile</button>
            </nav>

            <div class="workspace-grid">
                <aside class="sidebar">
                    <button class="side-item side-action side-dashboard" type="button" data-action="go-dashboard">DASHBOARD</button>
                    <button class="side-item side-action" type="button" data-action="search-profiles">Person Search</button>
                    <button class="side-item side-action" type="button" data-action="search-vehicles">Vehicle Search</button>
                    <button class="side-item side-action" type="button" data-action="active-warrants">Active Warrants</button>
                    <button class="side-item side-action" type="button" data-action="evidence">Evidence</button>
                    <button class="side-item side-action" type="button" data-action="reports">Reports</button>
                    <button id="panicButton" class="panic-btn" type="button">PANIC</button>
                </aside>

                <main class="page-container">
                    <section id="page-dashboard" class="page active"></section>
                    <section id="page-citizens" class="page"></section>
                    <section id="page-vehicles" class="page"></section>
                    <section id="page-reports" class="page"></section>
                    <section id="page-warrants" class="page"></section>
                    <section id="page-bolos" class="page"></section>
                    <section id="page-evidence" class="page"></section>
                    <section id="page-radar" class="page"></section>
                    <section id="page-officer" class="page"></section>
                </main>
            </div>
        </div>

        <div id="resizeHandle" class="resize-handle" aria-hidden="true"></div>
    </div>

    <script src="app.js"></script>
</body>
</html>
